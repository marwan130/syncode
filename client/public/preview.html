<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; object-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <script>
      (() => {
        let port;

        window.addEventListener('message', (event) => {
          if (
            event.source !== parent ||
            event.data?.type !== 'syncode-preview-connect' ||
            event.ports.length !== 1 ||
            port
          ) {
            return;
          }

          port = event.ports[0];
          port.onmessage = ({ data }) => {
            if (
              data?.type === 'syncode-preview-document' &&
              typeof data.document === 'string'
            ) {
              document.open();
              document.write(data.document);
              document.close();
            }
            if (data?.type === 'syncode-preview-history-move') {
              window.dispatchEvent(
                new CustomEvent('syncode-preview-history-move', {
                  detail: data.direction,
                })
              );
            }
          };
          port.start();
          port.postMessage({ type: 'syncode-preview-ready' });
        });
      })();
    </script>
  </body>
</html>
