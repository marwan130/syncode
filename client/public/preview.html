<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; object-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <script>
      window.addEventListener('message', (event) => {
        if (
          event.source !== parent ||
          event.data?.type !== 'syncode-preview-document' ||
          typeof event.data.document !== 'string'
        ) {
          return;
        }

        document.open();
        document.write(event.data.document);
        document.close();
      });
    </script>
  </body>
</html>
