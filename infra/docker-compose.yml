name: syncode

services:
  redis:
    image: redis:7.4-alpine
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$SYNCODE_REDIS_PASSWORD\""]
    environment:
      SYNCODE_REDIS_PASSWORD: ${SYNCODE_REDIS_PASSWORD:?Set SYNCODE_REDIS_PASSWORD to a random secret}
    volumes:
      - redis-data:/data
    ports:
      - "${SYNCODE_REDIS_BIND_IP:?Set SYNCODE_REDIS_BIND_IP to the app host WireGuard address}:6379:6379"
    networks:
      - service-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$SYNCODE_REDIS_PASSWORD\" ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  room-server:
    build:
      context: ..
      dockerfile: infra/Dockerfile.server
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:5111
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ReverseProxy__KnownProxies__0: ${SYNCODE_FRONTEND_PROXY_IP:-172.30.10.3}
      Redis: redis:6379,password=${SYNCODE_REDIS_PASSWORD:?Set SYNCODE_REDIS_PASSWORD to the Redis password}
      ExecutionService__BaseUrl: ${SYNCODE_EXECUTION_SERVICE_URL:?Set SYNCODE_EXECUTION_SERVICE_URL to the worker WireGuard URL}
      ExecutionService__ApiKey: ${SYNCODE_EXECUTION_API_KEY:?Set SYNCODE_EXECUTION_API_KEY in the app environment file}
      Github__ClientId: ${GITHUB_CLIENT_ID:?Set GITHUB_CLIENT_ID in the app environment file}
      Github__ClientSecret: ${GITHUB_CLIENT_SECRET:?Set GITHUB_CLIENT_SECRET in the app environment file}
      Github__RedirectUri: ${GITHUB_REDIRECT_URI:?Set GITHUB_REDIRECT_URI in the app environment file}
      Github__TokenEncryptionKey: ${GITHUB_TOKEN_ENCRYPTION_KEY:?Set GITHUB_TOKEN_ENCRYPTION_KEY in the app environment file}
      AllowedHosts: ${SYNCODE_ALLOWED_HOSTS:?Set SYNCODE_ALLOWED_HOSTS to the public hostname}
      AllowedOrigins__0: ${SYNCODE_ALLOWED_ORIGIN:?Set SYNCODE_ALLOWED_ORIGIN to the public HTTPS origin}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      frontend-network:
        ipv4_address: ${SYNCODE_ROOM_SERVER_IP:-172.30.10.2}
      service-network:
      github-egress:
    restart: unless-stopped

  client:
    build:
      context: ..
      dockerfile: infra/Dockerfile.client
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-}
        VITE_GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?Set GITHUB_CLIENT_ID in the app environment file}
    ports:
      - "127.0.0.1:${CLIENT_PORT:-8080}:8080"
    depends_on:
      - room-server
    networks:
      frontend-network:
        ipv4_address: ${SYNCODE_FRONTEND_PROXY_IP:-172.30.10.3}
    restart: unless-stopped

networks:
  frontend-network:
    internal: true
    ipam:
      config:
        - subnet: ${SYNCODE_FRONTEND_SUBNET:-172.30.10.0/24}
  service-network:
    internal: true
  github-egress:

volumes:
  redis-data:
