http_port 3128
visible_hostname syncode-package-proxy
cache deny all
cache_log /dev/stderr
access_log stdio:/dev/stdout
pid_filename /tmp/squid.pid
cache_effective_user syncode-proxy
cache_effective_group syncode-proxy
forwarded_for delete

acl CONNECT method CONNECT
acl SSL_ports port 443
acl Safe_ports port 80 443
acl registry_domains dstdomain .npmjs.org .yarnpkg.com .pypi.org .pythonhosted.org .nuget.org .globalcdn.nuget.org .crates.io .static.crates.io .maven.apache.org .maven.org .gradle.org .services.gradle.org .downloads.gradle.org .plugins.gradle.org .conan.io .center2.conan.io
acl private_destinations dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4 ::/128 ::1/128 fc00::/7 fe80::/10 ff00::/8

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow localhost manager
http_access deny manager
http_access deny private_destinations
http_access allow registry_domains
http_access deny all

delay_pools 1
delay_class 1 3
delay_access 1 allow registry_domains
delay_access 1 deny all
delay_parameters 1 -1/-1 1048576/2097152 65536/131072
