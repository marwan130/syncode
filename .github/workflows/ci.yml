name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install client dependencies
        working-directory: client
        run: npm ci
      - name: Check client formatting
        working-directory: client
        run: npm run format:check
      - name: Lint client
        working-directory: client
        run: npm run lint
      - name: Test client
        working-directory: client
        run: npm test
      - name: Build client
        working-directory: client
        run: npm run build

  dotnet:
    name: .NET checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build room server
        run: dotnet build server/Syncode.Server.csproj --configuration Release
      - name: Test execution service
        run: dotnet test execution-service.tests/Syncode.ExecutionService.Tests.csproj --configuration Release

  containers:
    name: Container build checks
    runs-on: ubuntu-latest
    env:
      SYNCODE_EXECUTION_API_KEY: ci-validation-only
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose configuration
        run: docker compose -f infra/docker-compose.yml config --quiet
      - name: Build client image
        run: docker build -f infra/Dockerfile.client -t syncode-client:ci .
      - name: Build room server image
        run: docker build -f infra/Dockerfile.server -t syncode-room-server:ci .
      - name: Build execution service image
        run: docker build -f execution-service/Dockerfile -t syncode-execution-service:ci .
